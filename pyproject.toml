[project]
name = "tinyaz"
version = "0.1.0"
description = "From-scratch AlphaZero-style chess net under 3M parameters"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
train = ["torch>=2.4", "chess>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyaz"]
